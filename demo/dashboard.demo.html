<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Vault Statistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ── Тёплая бежевая палитра (Paper) ── */
            --bg: #faf9f7;
            --surface: #ffffff;
            --surface-2: #f4f2ee;
            --border: #eae7e1;
            --border-strong: #d8d3ca;

            --text: #1c1917;
            --text-2: #57534e;
            --text-3: #a8a29e;

            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-soft: #fef3c7;
            --accent-text: #ffffff;

            /* Сложность */
            --beginner: #10b981;
            --intermediate: #f59e0b;
            --advanced: #ef4444;

            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;

            --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
            --shadow: 0 1px 2px rgba(28, 25, 23, 0.04), 0 1px 3px rgba(28, 25, 23, 0.06);
            --shadow-md: 0 4px 12px rgba(28, 25, 23, 0.06), 0 1px 3px rgba(28, 25, 23, 0.04);

            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem;
        }

        /* ═══════════ HEADER ═══════════ */
        header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: clamp(1.75rem, 3.5vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-2);
            margin-bottom: 1.25rem;
        }

        .metadata {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.75rem;
            font-size: 0.82rem;
            color: var(--text-2);
            padding: 0.4rem 0.9rem;
            background: var(--surface-2);
            border-radius: 999px;
        }

        /* ═══════════ АНИМАЦИИ ═══════════ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        section {
            margin-bottom: 3rem;
            animation: fadeInUp 0.4s var(--transition) both;
        }

        section:nth-of-type(1) { animation-delay: 0.04s; }
        section:nth-of-type(2) { animation-delay: 0.08s; }
        section:nth-of-type(3) { animation-delay: 0.12s; }
        section:nth-of-type(4) { animation-delay: 0.16s; }

        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 1.25rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ═══════════ STATS ═══════════ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            transition: all 0.2s var(--transition);
            animation: fadeInUp 0.4s var(--transition) both;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            margin-bottom: 0.15rem;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-2);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ═══════════ BAR CHART ═══════════ */
        .chart-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeInUp 0.4s var(--transition) both;
        }

        .bar-label {
            min-width: 180px;
            max-width: 180px;
            font-weight: 500;
            font-size: 0.88rem;
            color: var(--text);
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bar-wrapper {
            flex: 1;
            min-width: 0;
            background: var(--surface-2);
            border-radius: 6px;
            overflow: hidden;
        }

        .bar {
            height: 32px;
            background: var(--accent);
            border-radius: 6px;
            position: relative;
            display: flex;
            align-items: center;
            min-width: 44px;
            transition: width 0.7s var(--transition);
        }

        .bar-value {
            margin-left: auto;
            margin-right: 0.65rem;
            color: var(--accent-text);
            font-weight: 600;
            font-size: 0.82rem;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ═══════════ DOMAIN CARDS ═══════════ */
        .domains-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .domain-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.2s var(--transition);
            animation: fadeInUp 0.4s var(--transition) both;
            display: flex;
            flex-direction: column;
        }

        .domain-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }

        .domain-header {
            padding: 1.25rem 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .domain-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .domain-stats {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.82rem;
        }

        .file-count {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
            color: var(--text-2);
        }

        /* ═══════════ DIFFICULTY ═══════════ */
        .difficulty-chart {
            display: flex;
            gap: 3px;
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            width: 100%;
        }

        .difficulty-bar {
            border-radius: 999px;
            transition: flex 0.4s var(--transition);
        }

        .difficulty-bar.beginner     { background: var(--beginner); }
        .difficulty-bar.intermediate { background: var(--intermediate); }
        .difficulty-bar.advanced     { background: var(--advanced); }

        .difficulty-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.85rem;
            margin-top: 0.5rem;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-2);
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-dot.beginner     { background: var(--beginner); }
        .legend-dot.intermediate { background: var(--intermediate); }
        .legend-dot.advanced     { background: var(--advanced); }

        /* ═══════════ LEARNING PATHS ═══════════ */
        .domain-body {
            padding: 1rem 1.5rem 1.25rem;
            flex: 1;
        }

        .learning-paths {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .learning-path {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 0.85rem;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            transition: background 0.2s var(--transition);
        }

        .learning-path:hover {
            background: var(--accent-soft);
        }

        .path-level {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .path-hours {
            font-size: 0.78rem;
            color: var(--text-2);
            font-weight: 500;
            white-space: nowrap;
        }

        .no-paths {
            color: var(--text-3);
            font-size: 0.82rem;
            font-style: italic;
        }

        /* ═══════════ TECHNOLOGIES ═══════════ */
        .technologies {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tech-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border);
            transition: all 0.2s var(--transition);
            cursor: default;
        }

        .tech-tag:hover {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        /* ═══════════ LOADING / ERROR ═══════════ */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 4rem 2rem;
            color: var(--text-2);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .loading::before {
            content: '';
            width: 32px;
            height: 32px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            border: 1px solid #fecaca;
            font-weight: 500;
            font-size: 0.9rem;
        }

        footer { display: none; }

        /* ═══════════ RESPONSIVE ═══════════ */
        @media (max-width: 768px) {
            .container { padding: 2rem 1rem 3rem; }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }

            .stat-card { padding: 1rem; }
            .stat-number { font-size: 1.6rem; }

            .domains-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .chart-container { padding: 1.25rem; }

            .bar-label {
                min-width: 110px;
                max-width: 110px;
                font-size: 0.8rem;
            }

            .bar { height: 28px; }
            h2 { font-size: 1.05rem; }
        }

        /* ═══════════ TOPIC MODAL (макет C: список + детали) ═══════════ */
        .domain-card { cursor: pointer; }

        .topic-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 25, 23, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
        }

        .topic-modal-overlay[hidden] { display: none !important; }

        .topic-modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 880px;
            max-width: 100%;
            max-height: 88vh;
            display: flex;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .topic-modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            line-height: 1;
            color: var(--text-3);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }

        .topic-modal-close:hover { color: var(--text); }

        .topic-modal-col-left {
            width: 260px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .topic-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.1rem 0.75rem;
        }

        .topic-modal-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }

        .topic-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.1rem;
            font-size: 0.85rem;
            cursor: pointer;
            border-left: 3px solid transparent;
            color: var(--text-2);
        }

        .topic-list-item:hover { background: var(--surface-2); }

        .topic-list-item.active {
            background: var(--surface-2);
            border-left-color: var(--accent);
            color: var(--text);
            font-weight: 600;
        }

        .topic-list-pct { font-size: 0.78rem; color: var(--text-3); }
        .topic-list-pct.low { color: var(--advanced); }

        .topic-modal-col-right {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .topic-detail-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .topic-not-studied-badge {
            display: inline-block;
            font-size: 0.72rem;
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            margin-left: 0.5rem;
            font-weight: 500;
            vertical-align: middle;
        }

        .topic-progress-bar {
            height: 8px;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.75rem 0;
        }

        .topic-progress-fill {
            height: 100%;
            background: var(--accent);
        }

        .topic-detail-summary {
            font-size: 0.88rem;
            color: var(--text-2);
        }

        .topic-detail-rationale {
            font-size: 0.8rem;
            color: var(--text-3);
            font-style: italic;
            margin-top: 0.5rem;
        }

        .topic-rec-block {
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .topic-rec-block h3 {
            font-size: 0.85rem;
            color: var(--text-2);
            margin-bottom: 0.6rem;
        }

        .topic-rec-row {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.85rem;
            padding: 0.4rem 0;
            color: var(--text);
        }

        .topic-rec-row .topic-rec-cross {
            font-size: 0.72rem;
            color: var(--accent-hover);
            display: block;
        }

        .topic-modal-empty-state {
            padding: 2rem 1.5rem;
            color: var(--text-2);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            .topic-modal { flex-direction: column; max-height: 92vh; }
            .topic-modal-col-left {
                width: 100%;
                max-height: 35vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Obsidian Vault Statistics</h1>
            <p class="subtitle">Анализ структуры вашего хранилища знаний</p>
            <p class="metadata" id="metadata">Загрузка...</p>
        </header>

        <div id="loading" class="loading">Загрузка данных</div>
        <div id="error"></div>
        <div id="content" style="display: none;">
            <section>
                <div class="stats-grid" id="statsGrid"></div>
            </section>

            <section>
                <h2>📚 Распределение по доменам</h2>
                <div class="chart-container">
                    <div class="bar-chart" id="domainChart"></div>
                </div>
            </section>

            <section>
                <h2>🏛️ Детальный анализ доменов</h2>
                <div class="domains-grid" id="domainsGrid"></div>
            </section>

            <section>
                <h2>⚙️ Используемые технологии</h2>
                <div class="chart-container">
                    <div class="technologies" id="techsList"></div>
                </div>
            </section>
        </div>

        <footer><p id="footerDate"></p></footer>
    </div>

    <div class="topic-modal-overlay" id="topicModalOverlay" hidden>
        <div class="topic-modal" role="dialog" aria-modal="true" aria-labelledby="topicModalDomainName">
            <div class="topic-modal-col-left">
                <div class="topic-modal-header">
                    <h2 id="topicModalDomainName"></h2>
                    <button class="topic-modal-close" id="topicModalClose" aria-label="Закрыть">✕</button>
                </div>
                <div id="topicModalList"></div>
            </div>
            <div class="topic-modal-col-right" id="topicModalDetail"></div>
        </div>
    </div>

    <script>
        /* ═══════════ ЗАГРУЗКА ДАННЫХ ═══════════ */

        let domainsById = {};

        async function loadDashboard() {
            try {
                let data;

                // Загрузить демо-таксономию (всегда из текущей папки)
                const response = await fetch('./taxonomy.sample.json');
                if (!response.ok) {
                    throw new Error(`Не удалось загрузить taxonomy.sample.json (HTTP ${response.status})`);
                }
                data = await response.json();

                renderDashboard(data);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').innerHTML =
                    `<div class="error">❌ Ошибка: ${error.message}</div>`;
            }
        }

        /* ═══════════ РЕНДЕРИНГ ═══════════ */

        function renderDashboard(data) {
            const { metadata, domains } = data;

            domainsById = Object.fromEntries(domains.map(d => [d.domain_id, d]));

            document.getElementById('metadata').innerHTML =
                `📅 ${metadata.analysis_date} · 📁 ${metadata.vault_path}`;

            renderStats(calculateStats(domains));
            renderDomainChart(domains);
            renderDomainCards(domains);
            renderTechnologies(domains);
        }

        function calculateStats(domains) {
            return {
                totalFiles: domains.reduce((sum, d) => sum + d.file_count, 0),
                totalDomains: domains.length
            };
        }

        function renderStats(stats) {
            const grid = document.getElementById('statsGrid');
            const items = [
                { label: 'Файлов', value: stats.totalFiles },
                { label: 'Доменов', value: stats.totalDomains }
            ];
            grid.innerHTML = items.map((s, i) => `
                <div class="stat-card" style="animation-delay: ${i * 0.06}s;">
                    <div class="stat-number">${s.value}</div>
                    <div class="stat-label">${s.label}</div>
                </div>
            `).join('');
        }

        function renderDomainChart(domains) {
            const chart = document.getElementById('domainChart');
            const active = domains
                .filter(d => d.file_count > 0)
                .sort((a, b) => b.file_count - a.file_count);
            const max = Math.max(...active.map(d => d.file_count));

            chart.innerHTML = active.map((d, i) => {
                const pct = (d.file_count / max) * 100;
                return `
                    <div class="bar-item" style="animation-delay: ${i * 0.04}s;">
                        <div class="bar-label" title="${d.domain_name}">${d.domain_name}</div>
                        <div class="bar-wrapper">
                            <div class="bar" style="width: ${pct}%;">
                                <span class="bar-value">${d.file_count}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calcDifficulty(domain) {
            const dist = { beginner: 0, intermediate: 0, advanced: 0 };
            (domain.files || []).forEach(f => {
                if (f.difficulty && dist.hasOwnProperty(f.difficulty)) dist[f.difficulty]++;
            });
            return dist;
        }

        function renderDifficulty(dist) {
            const total = dist.beginner + dist.intermediate + dist.advanced;
            if (total === 0) return '';

            const labels = { beginner: 'Начальный', intermediate: 'Средний', advanced: 'Продвинутый' };

            const bars = Object.entries(dist)
                .filter(([_, c]) => c > 0)
                .map(([lvl, c]) => {
                    const pct = Math.round((c / total) * 100);
                    return `<div class="difficulty-bar ${lvl}" style="flex: ${c}" title="${labels[lvl]}: ${c} (${pct}%)"></div>`;
                }).join('');

            const legend = Object.entries(dist)
                .filter(([_, c]) => c > 0)
                .map(([lvl, c]) =>
                    `<span class="legend-item"><span class="legend-dot ${lvl}"></span>${labels[lvl]} · ${c}</span>`
                ).join('');

            return `
                <div class="difficulty-chart">${bars}</div>
                <div class="difficulty-legend">${legend}</div>
            `;
        }

        function renderDomainCards(domains) {
            const grid = document.getElementById('domainsGrid');
            const active = domains.filter(d => d.file_count > 0);

            grid.innerHTML = active.map((d, i) => {
                const paths = Object.entries(d.learning_paths || {})
                    .filter(([_, p]) => p.files && p.files.length > 0);

                const pathsHtml = paths.map(([lvl, p]) => `
                    <div class="learning-path">
                        <span class="path-level">${lvl.charAt(0).toUpperCase() + lvl.slice(1)}</span>
                        <span class="path-hours">📚 ${p.files.length} · ⏱️ ${p.estimated_hours}ч</span>
                    </div>
                `).join('');

                const diff = calcDifficulty(d);

                return `
                    <div class="domain-card" style="animation-delay: ${i * 0.05}s;" data-domain-id="${d.domain_id}">
                        <div class="domain-header">
                            <div class="domain-name">${d.domain_name}</div>
                            <div class="domain-stats">
                                <span class="file-count">📄 ${d.file_count} файлов</span>
                                ${renderDifficulty(diff)}
                            </div>
                        </div>
                        <div class="domain-body">
                            ${paths.length > 0
                                ? `<div class="learning-paths">${pathsHtml}</div>`
                                : '<p class="no-paths">Нет обучающих путей</p>'}
                        </div>
                    </div>
                `;
            }).join('');

            grid.querySelectorAll('.domain-card').forEach(card => {
                card.addEventListener('click', () => {
                    const domain = domainsById[card.dataset.domainId];
                    if (domain) openTopicModal(domain);
                });
            });
        }

        function renderTechnologies(domains) {
            const techCount = {};
            const seen = new Set();

            domains.forEach(d => {
                (d.files || []).forEach(f => {
                    (f.technologies || []).forEach(t => {
                        const norm = t.trim().toLowerCase();
                        if (norm && !seen.has(norm)) {
                            seen.add(norm);
                            techCount[t.trim()] = (techCount[t.trim()] || 0) + 1;
                        }
                    });
                });
            });

            const top = Object.entries(techCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 30)
                .map(([t]) => t);

            document.getElementById('techsList').innerHTML =
                top.map(t => `<span class="tech-tag">${t}</span>`).join('');
        }

        /* ═══════════ МОДАЛЬНОЕ ОКНО ТЕМ ДОМЕНА (макет C) ═══════════ */

        let activeModalDomain = null;
        let activeTopicId = null;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // taxonomy.json — результат LLM-анализа содержимого vault (потенциально
        // недоверенных заметок третьих лиц); mastery_percent обязан быть числом
        // 0-100 (data-model.md), но не валидируется на входе — без явного
        // приведения типа он мог бы попасть в атрибут style как есть.
        function safePercent(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return 0;
            return Math.min(100, Math.max(0, Math.round(n)));
        }

        function openTopicModal(domain) {
            activeModalDomain = domain;
            const topics = Array.isArray(domain.topics) ? domain.topics : null;

            document.getElementById('topicModalDomainName').textContent = domain.domain_name;
            const overlay = document.getElementById('topicModalOverlay');
            const listEl = document.getElementById('topicModalList');
            const detailEl = document.getElementById('topicModalDetail');

            if (topics === null) {
                // FR-011 / contracts: поле topics отсутствует — старая таксономия без уровня тем
                listEl.innerHTML = '';
                detailEl.innerHTML = `
                    <div class="topic-modal-empty-state">
                        Детальный анализ тем для этого домена не построен.<br>
                        Пересоберите таксономию (skill <code>semantic-taxonomy</code>), чтобы увидеть темы,
                        проценты проработки и рекомендации.
                    </div>`;
            } else if (topics.length === 0) {
                // Edge case: непустой домен без единой темы трактуется как ошибка анализа, не как "тем нет"
                listEl.innerHTML = '';
                detailEl.innerHTML = `
                    <div class="topic-modal-empty-state">
                        Анализ тем недоступен для этого домена (пустой результат анализа).<br>
                        Попробуйте пересобрать таксономию ещё раз.
                    </div>`;
            } else {
                renderTopicList(topics);
                selectTopic(topics[0].topic_id);
            }

            overlay.hidden = false;
        }

        function closeTopicModal() {
            document.getElementById('topicModalOverlay').hidden = true;
            activeModalDomain = null;
            activeTopicId = null;
        }

        function renderTopicList(topics) {
            const listEl = document.getElementById('topicModalList');
            listEl.innerHTML = topics.map(t => {
                const pct = safePercent(t.mastery_percent);
                const pctClass = pct < 30 ? 'low' : '';
                return `
                    <div class="topic-list-item" data-topic-id="${escapeHtml(t.topic_id)}">
                        <span>${escapeHtml(t.topic_name)}</span>
                        <span class="topic-list-pct ${pctClass}">${pct}%</span>
                    </div>
                `;
            }).join('');

            listEl.querySelectorAll('.topic-list-item').forEach(item => {
                item.addEventListener('click', () => selectTopic(item.dataset.topicId));
            });
        }

        function selectTopic(topicId) {
            activeTopicId = topicId;
            const topics = activeModalDomain.topics || [];
            const topic = topics.find(t => t.topic_id === topicId);
            if (!topic) return;

            document.querySelectorAll('.topic-list-item').forEach(item => {
                item.classList.toggle('active', item.dataset.topicId === topicId);
            });

            renderTopicDetail(topic);
        }

        function renderTopicDetail(topic) {
            const detailEl = document.getElementById('topicModalDetail');
            const notStudiedBadge = topic.has_notes === false
                ? '<span class="topic-not-studied-badge">не изучено</span>'
                : '';

            detailEl.innerHTML = `
                <div class="topic-detail-title">${escapeHtml(topic.topic_name)}${notStudiedBadge}</div>
                <div class="topic-progress-bar">
                    <div class="topic-progress-fill" style="width: ${safePercent(topic.mastery_percent)}%"></div>
                </div>
                <div class="topic-detail-summary">${escapeHtml(topic.summary)}</div>
                ${topic.mastery_rationale
                    ? `<div class="topic-detail-rationale">Обоснование: ${escapeHtml(topic.mastery_rationale)}</div>`
                    : ''}
                ${renderRecommendationsBlock(activeModalDomain.recommended_topics)}
            `;
        }

        function renderRecommendationsBlock(recommendedTopics) {
            const recs = Array.isArray(recommendedTopics) ? recommendedTopics.slice() : [];

            if (recs.length === 0) {
                return `
                    <div class="topic-rec-block">
                        <h3>Рекомендуется изучить</h3>
                        <p class="topic-modal-empty-state" style="padding: 0.5rem 0; text-align: left;">
                            Все выявленные темы этого домена проработаны на высоком уровне — новых рекомендаций нет.
                        </p>
                    </div>
                `;
            }

            // Защитная сортировка на стороне UI — не полагаемся только на порядок с сервера
            recs.sort((a, b) => safePercent(a.mastery_percent) - safePercent(b.mastery_percent));

            const rows = recs.map(r => {
                const crossBadge = r.is_cross_domain
                    ? `<span class="topic-rec-cross">${escapeHtml(r.reason || '')}</span>`
                    : '';
                return `
                    <div class="topic-rec-row">
                        <span>${escapeHtml(r.topic_name)}${crossBadge}</span>
                        <span>${safePercent(r.mastery_percent)}%${r.has_notes === false ? ' · не изучено' : ''}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="topic-rec-block">
                    <h3>Рекомендуется изучить</h3>
                    ${rows}
                </div>
            `;
        }

        document.getElementById('topicModalClose').addEventListener('click', closeTopicModal);

        document.getElementById('topicModalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'topicModalOverlay') closeTopicModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('topicModalOverlay').hidden) {
                closeTopicModal();
            }
        });

        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
